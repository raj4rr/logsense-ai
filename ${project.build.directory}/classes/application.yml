server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: logsense-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logsense}
    username: ${DB_USER:logsense}
    password: ${DB_PASSWORD:logsense_dev}
  jdbc:
    template:
      query-timeout: 10
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    model:
      chat: ${AI_PROVIDER:ollama}
    mcp:
      server:
        name: logsense-ai
        version: 0.2.0
        protocol: STREAMABLE
        type: SYNC
        annotation-scanner:
          enabled: true
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logsense:
  ai-provider: ${AI_PROVIDER:ollama}
  security:
    api-key: ${LOGSENSE_API_KEY:}
    allow-local-no-key: false
    issuer-uri: ${JWT_ISSUER_URI:}
  files:
    allowed-roots: ${LOGSENSE_ALLOWED_ROOTS:./sample-logs}
  limits:
    max-results: 500
    max-window-hours: 168
  sources:
    docker:
      enabled: ${DOCKER_ENABLED:false}
      host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    kubernetes:
      api-url: ${KUBERNETES_API_URL:}
      bearer-token: ${KUBERNETES_TOKEN:}
      namespace: ${KUBERNETES_NAMESPACE:default}
      enabled: ${KUBERNETES_ENABLED:false}
    elasticsearch:
      url: ${ELASTICSEARCH_URL:}
      token: ${ELASTICSEARCH_TOKEN:}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
    loki:
      url: ${LOKI_URL:}
      token: ${LOKI_TOKEN:}
    splunk:
      url: ${SPLUNK_URL:}
      token: ${SPLUNK_TOKEN:}
      index: ${SPLUNK_INDEX:main}
    cloudwatch:
      region: ${AWS_REGION:}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
      group-id: logsense-readonly
      security-protocol: ${KAFKA_SECURITY_PROTOCOL:}
      sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
      sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
    postgres:
      url: ${SOURCE_POSTGRES_URL:}
      username: ${SOURCE_POSTGRES_USER:}
      password: ${SOURCE_POSTGRES_PASSWORD:}
      table: ${SOURCE_POSTGRES_TABLE:logsense_log_events}
